<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250"><defs><marker id="prop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="proto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc6b20"/></marker><marker id="ctor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker></defs><rect width="1900" height="1250" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:36px;font-weight:700}.name{font-size:25px;font-weight:700}.body{font-size:21px}.edge{font-size:19px;font-weight:600;paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round}</style><text x="65" y="65" class="title">Связи объектов и прототипов</text><text x="65" y="105" class="body">По исходному code.js: Person — class, Student — обычная функция.</text><rect x="70" y="190" width="270" height="110" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="92" y="227" class="name">Object</text><text x="92" y="264" class="body">встроенная функция</text><rect x="430" y="190" width="270" height="110" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="452" y="227" class="name">Function</text><text x="452" y="264" class="body">встроенная функция</text><rect x="900" y="190" width="310" height="140" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="922" y="227" class="name">Function.prototype</text><text x="922" y="264" class="body">вызываемый объект</text><text x="922" y="294" class="body">call, apply, bind</text><rect x="1400" y="190" width="330" height="140" rx="18" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/><text x="1422" y="227" class="name">Object.prototype</text><text x="1422" y="264" class="body">toString, valueOf, ...</text><text x="1422" y="294" class="body">constructor = Object</text><rect x="70" y="475" width="300" height="130" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="92" y="512" class="name">Person</text><text x="92" y="549" class="body">класс-конструктор</text><text x="92" y="579" class="body">constructor(name, age, sex)</text><rect x="430" y="475" width="300" height="130" rx="18" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="452" y="512" class="name">Student</text><text x="452" y="549" class="body">функция-конструктор</text><text x="452" y="579" class="body">Person.call(this, ...)</text><rect x="960" y="475" width="360" height="170" rx="18" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/><text x="982" y="512" class="name">Person.prototype</text><text x="982" y="549" class="body">= Student.prototype</text><text x="982" y="579" class="body">get fullInfo()</text><text x="982" y="609" class="body">constructor = Person</text><rect x="70" y="785" width="330" height="170" rx="18" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/><text x="92" y="822" class="name">a</text><text x="92" y="859" class="body">экземпляр Person</text><text x="92" y="889" class="body">name: &quot;a&quot;, age: 20, sex: &quot;f&quot;</text><text x="92" y="919" class="body">grow — собственная функция</text><rect x="460" y="785" width="390" height="170" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="482" y="822" class="name">b</text><text x="482" y="859" class="body">не инициализирован</text><text x="482" y="889" class="body">new Student(...) → TypeError</text><text x="482" y="919" class="body">Person нельзя вызвать через call</text><text x="1785" y="270" class="name">null</text><path d="M340 220 H390 V145 H870 V220 H900" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="520" y="140" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M700 270 H900" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="730" y="257" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M1210 270 H1400" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="1220" y="257" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M1730 270 H1770" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><path d="M1565 190 V155 H205 V190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ctor)" stroke-dasharray="9 7"/><text x="1230" y="149" class="edge" style="fill:#64748b">constructor</text><path d="M1055 190 V125 H565 V190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ctor)" stroke-dasharray="9 7"/><text x="750" y="119" class="edge" style="fill:#64748b">constructor</text><path d="M205 300 V350 H1565 V330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#prop)"/><text x="720" y="343" class="edge" style="fill:#2563eb">prototype</text><path d="M565 300 V380 H1055 V330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#prop)"/><text x="760" y="374" class="edge" style="fill:#2563eb">prototype</text><path d="M220 475 V410 H845 V290 H900" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="350" y="404" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M730 510 H810 V310 H900" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="815" y="450" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M220 605 V700 H920 V530 H960" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#prop)"/><text x="740" y="693" class="edge" style="fill:#2563eb">prototype</text><path d="M730 600 H960" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#prop)"/><text x="770" y="593" class="edge" style="fill:#2563eb">prototype</text><path d="M1140 475 V405 H1565 V330" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="1190" y="398" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M960 625 H385 V590 H370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ctor)" stroke-dasharray="9 7"/><text x="520" y="650" class="edge" style="fill:#64748b">constructor</text><path d="M235 785 V740 H1140 V645" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="870" y="733" class="edge" style="fill:#dc6b20">[[Prototype]]</text><path d="M850 915 H1260 V645" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#error)" stroke-dasharray="9 7"/><text x="890" y="907" class="edge" style="fill:#b91c1c">временный this при new</text><text x="65" y="1020" class="name">Почему b не создан</text><text x="65" y="1058" class="body">В Student выполняется Person.call(this, ...). Класс Person нельзя вызвать как обычную функцию: возникает TypeError.</text><text x="65" y="1093" class="body">Объект this уже выделен с Person.prototype, но конструктор не завершён; привязка const b остаётся неинициализированной.</text><text x="65" y="1128" class="body">Student.prototype = Person.prototype заменяет readBook целиком. Отдельного Student.prototype больше нет; readBook потерян.</text><text x="65" y="1163" class="body">grow находится только у a. Геттер fullInfo наследуется a от общего прототипа. Статического наследования Student от Person нет.</text><path d="M65 1210 H150" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#prop)"/><text x="170" y="1217" class="edge" style="fill:#2563eb">prototype — свойство</text><path d="M550 1210 H635" fill="none" stroke="#dc6b20" stroke-width="3" marker-end="url(#proto)"/><text x="655" y="1217" class="edge" style="fill:#dc6b20">[[Prototype]] — внутренняя связь</text><path d="M1190 1210 H1275" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ctor)" stroke-dasharray="9 7"/><text x="1295" y="1217" class="edge" style="fill:#64748b">constructor — свойство</text></svg>